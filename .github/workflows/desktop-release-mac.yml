name: Byg og udgiv Mac-beta
# Bygger den ad hoc-signerede Mac-beta med desktop/scripts/release-local.cjs på en GitHub-maskine,
# afprøver den færdige pakke og offentliggør den som beta. Det er samme to kommandoer som en lokal
# udgivelse (docs/udgivelse.md), uden et stop imellem. Startes kun manuelt og kun fra main.
on:
  workflow_dispatch:
    inputs:
      skip_check:
        description: Udelad den samlede kontrol af kildekoden. Pakken afprøves stadig.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-mac
  cancel-in-progress: false
jobs:
  udgiv:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Byg og afprøv kandidaten
        run: node scripts/release-local.cjs build ${{ inputs.skip_check && '--skip-check' || '' }}
      - name: Offentliggør betaen
        run: |
          set -euo pipefail
          candidates=(release/candidate-*)
          if [ "${#candidates[@]}" -ne 1 ] || [ ! -d "${candidates[0]}" ]; then echo "Forventede præcis én kandidatmappe fra build."; exit 1; fi
          node scripts/release-local.cjs publish "${candidates[0]}"
      - name: Gem kvalifikationen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-beta-kvalifikation
          if-no-files-found: ignore
          path: |
            desktop/release/candidate-*/*.json
            desktop/release/candidate-*/SHA256SUMS.txt
            desktop/release/candidate-*/beta-mac.yml
            desktop/release/candidate-*/release-body.md
