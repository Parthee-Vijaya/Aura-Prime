name: Lokal motor
# Kvalificerer den indbyggede motor med de rigtige, fastlåste filer på Apple Silicon og Linux.
# Kører kun, når motoren eller dens fastlåsning ændres, eller når den startes manuelt.
on:
  pull_request:
    paths:
      - desktop/core/local-models/**
      - desktop/scripts/verify-local-engine.cjs
      - .github/workflows/local-engine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kvalificer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: node desktop/scripts/verify-local-engine.cjs
